# Real servers for the integration tests of the connectors (test-services/README.md). Everything listens on 127.0.0.1
# only and uses the tags, ports and test passwords of .env. Most data is in memory; Oracle uses its disposable
# container filesystem. Removing the containers resets all database data.
#
#   scripts/test-services.sh up sql redis      # or: docker compose -f test-services/docker-compose.yml --profile sql up -d --wait
#   mvn -B -ntp verify -Pservices              # the ITs connect here instead of starting their own servers
#
# Profiles: sql · oracle · sqlserver · cockroach · trino · cosmosdb · spanner · cassandra · mongo · neo4j · redis · logs · aws · dynamodb · prometheus · influxdb · search · vault · ssh · k8s · all
name: gw-test

x-health: &health
  interval: 2s
  timeout: 5s
  retries: 90
  start_period: 5s

x-certs: &certs
  certs:
    condition: service_completed_successfully

services:
  # One-shot: the CA and server certificates of run/certs, made the first time only (scripts/gen-certs.sh). Its
  # profiles are those of the services that need it: a dependency doesn't start with another profile by itself.
  certs:
    image: alpine:${GW_ALPINE_TAG}
    container_name: gw-test-certs
    profiles: [sql, mongo, redis, vault, all]
    command: ["/bin/sh", "/scripts/gen-certs.sh", "/out"]
    volumes:
      - ./scripts:/scripts:ro
      - ./run/certs:/out

  # ── SQL ─────────────────────────────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:${GW_PG_TAG}
    container_name: gw-test-postgres
    profiles: [sql, vault, all]
    depends_on: *certs
    command: ["/bin/sh", "/scripts/postgres-start.sh"]
    environment:
      POSTGRES_PASSWORD: ${GW_PG_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - ./scripts:/scripts:ro
      - ./run/certs:/certs:ro
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${GW_PG_PORT}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      <<: *health

  mysql:
    image: mysql:${GW_MYSQL_TAG}
    container_name: gw-test-mysql
    profiles: [sql, all]
    command: ["--disable-log-bin", "--innodb-buffer-pool-size=64M", "--performance-schema=OFF", "--mysqlx=OFF"]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    tmpfs:
      - /var/lib/mysql
    ports:
      - "127.0.0.1:${GW_MYSQL_PORT}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "--silent"]
      <<: *health

  mariadb:
    image: mariadb:${GW_MARIADB_TAG}
    container_name: gw-test-mariadb
    profiles: [sql, all]
    command: ["--innodb-buffer-pool-size=64M"]
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
    tmpfs:
      - /var/lib/mysql
    ports:
      - "127.0.0.1:${GW_MARIADB_PORT}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      <<: *health

  # CockroachDB speaks PostgreSQL's protocol: the postgres connector against one in-memory node. The image makes
  # its own CA and certificates in run/cockroach-certs (TLS on, password sign-in) and the admin user gaterook; the
  # IT adds a reader.
  cockroach:
    image: cockroachdb/cockroach:${GW_COCKROACH_TAG}
    container_name: gw-test-cockroach
    profiles: [cockroach, all]
    mem_limit: 2g
    command: ["start-single-node", "--store=type=mem,size=1GiB", "--cache=64MiB", "--max-sql-memory=256MiB"]
    environment:
      COCKROACH_USER: gaterook
      COCKROACH_PASSWORD: ${GW_COCKROACH_PASSWORD}
      COCKROACH_DATABASE: gaterook
    volumes:
      # The image's CA and certificates (for 127.0.0.1): the IT verifies the server with ca.crt.
      - ./run/cockroach-certs:/cockroach/certs
    ports:
      - "127.0.0.1:${GW_COCKROACH_PORT}:26257"
    healthcheck:
      test: ["CMD", "/cockroach/cockroach", "sql", "--certs-dir=/cockroach/certs", "--host=127.0.0.1", "-e", "SELECT 1"]
      <<: *health

  # Trino (connectors/trino): one coordinator that is its own worker, with only the built-in memory and tpch catalogs
  # of trino/catalog and only their two plugins loaded. The tpch generator keeps a 300 MB text pool in the 768 MiB
  # heap, so the rest is kept small: capped native memory and a C1-only JIT (trino/jvm.config), two malloc arenas, few
  # threads, little query memory and a short query history (trino/config.properties). Repeated IT runs peak near
  # 1.05 GiB. No authentication: the IT names its user on loopback.
  trino:
    image: trinodb/trino:${GW_TRINO_TAG}
    container_name: gw-test-trino
    profiles: [trino, all]
    mem_limit: 1280m
    environment:
      MALLOC_ARENA_MAX: "2"
    # Trino loads every plugin of its plugin directory: give it one with only the plugins of these catalogs.
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /tmp/plugin && ln -sf /usr/lib/trino/plugin/memory /usr/lib/trino/plugin/tpch /tmp/plugin/ && exec /usr/lib/trino/bin/launcher run --etc-dir /etc/trino
    volumes:
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/catalog:/etc/trino/catalog:ro
    ports:
      - "127.0.0.1:${GW_TRINO_PORT}:8080"
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      <<: *health

  # Google Cloud Spanner through Google's emulator (connectors/spanner): its REST API on plain HTTP, GoogleSQL and
  # PostgreSQL-dialect databases in memory. It checks no credentials; the IT makes its own instance and databases. The
  # image is distroless, so there is no health check: the IT waits for the REST port.
  spanner:
    image: gcr.io/cloud-spanner-emulator/emulator:${GW_SPANNER_TAG}
    container_name: gw-test-spanner
    profiles: [spanner, all]
    mem_limit: 512m
    ports:
      - "127.0.0.1:${GW_SPANNER_PORT}:9020"

  # Azure Cosmos DB for NoSQL through the Linux emulator vNext (amd64 and arm64): the gateway on plain HTTP, about
  # 700 MB at rest. Its data lives in the container and goes with it. It checks no key or token; the IT signs with the
  # well-known emulator key of .env, and the signature itself is checked against a fake (CosmosDbConnectorTest).
  cosmosdb:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:${GW_COSMOSDB_TAG}
    container_name: gw-test-cosmosdb
    profiles: [cosmosdb, all]
    mem_limit: 2g
    environment:
      PROTOCOL: http
      ENABLE_EXPLORER: "false"
      ENABLE_TELEMETRY: "false"
      LOG_LEVEL: warn
    ports:
      - "127.0.0.1:${GW_COSMOSDB_PORT}:8081"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/ready"]
      <<: *health

  # Apache Cassandra 5.0 through connectors/cassandra: one node, data center gw-dc1, password sign-in with roles and
  # permissions, and TLS on the native port next to plain CQL. cassandra-start.sh switches the authenticator and
  # authorizer (the image has no variables for them) and makes the node's certificate in run/cassandra-certs. Its
  # data stays in the container's writable layer and is removed with it.
  cassandra:
    image: cassandra:${GW_CASSANDRA_TAG}
    container_name: gw-test-cassandra
    profiles: [cassandra, all]
    mem_limit: 1280m
    entrypoint: ["/bin/sh", "/scripts/cassandra-start.sh"]
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      CASSANDRA_CLUSTER_NAME: gw-test
      CASSANDRA_DC: gw-dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      JVM_EXTRA_OPTS: "-Dcassandra.superuser_setup_delay_ms=0 -Dcassandra.skip_wait_for_gossip_to_settle=0"
      GW_CASSANDRA_KEYSTORE_PASSWORD: ${GW_CASSANDRA_KEYSTORE_PASSWORD}
    volumes:
      - ./scripts:/scripts:ro
      - ./run/cassandra-certs:/certs
    ports:
      - "127.0.0.1:${GW_CASSANDRA_PORT}:9042"
    healthcheck:
      test: ["CMD", "cqlsh", "-u", "${GW_CASSANDRA_USER}", "-p", "${GW_CASSANDRA_PASSWORD}", "-e",
             "SELECT release_version FROM system.local"]
      interval: 5s
      timeout: 15s
      retries: 60
      start_period: 30s

  # Oracle Free includes FREEPDB1 on both amd64 and arm64. Keep its large datafiles in the container layer:
  # they are removed with the container, without consuming the Docker VM's RAM as a data tmpfs would.
  oracle:
    image: ghcr.io/gvenzl/oracle-free:${GW_ORACLE_TAG}
    container_name: gw-test-oracle
    profiles: [sql, oracle, all]
    mem_limit: 2g
    shm_size: 1g
    entrypoint: ["/bin/bash", "/opt/gaterook-test/start.sh"]
    environment:
      ORACLE_PASSWORD: ${GW_ORACLE_ADMIN_PASSWORD}
      GW_ORACLE_SERVICE: ${GW_ORACLE_SERVICE}
      GW_ORACLE_USER: ${GW_ORACLE_USER}
      GW_ORACLE_PASSWORD: ${GW_ORACLE_PASSWORD}
    volumes:
      - ./oracle/start.sh:/opt/gaterook-test/start.sh:ro
      - ./oracle/init-user.sh:/container-entrypoint-initdb.d/001-init-user.sh:ro
      - ./oracle/healthcheck.sh:/opt/gaterook-test/healthcheck.sh:ro
    ports:
      - "127.0.0.1:${GW_ORACLE_PORT}:1521"
    healthcheck:
      test: ["CMD", "/bin/bash", "/opt/gaterook-test/healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

  # SQL Server has only x86-64 Linux images. Keep this opt-in on ARM hosts.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:${GW_SQLSERVER_TAG}
    container_name: gw-test-sqlserver
    platform: linux/amd64
    mem_limit: 2560m
    profiles: [sqlserver, all]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${GW_SQLSERVER_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: 2048
    tmpfs:
      - /var/opt/mssql:uid=10001,gid=0
    ports:
      - "127.0.0.1:${GW_SQLSERVER_PORT}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      <<: *health

  # ── MongoDB ─────────────────────────────────────────────────────────────────────────────────────────────────
  # Users other than root are made by the tests (LocalMongod), which also drop what a previous run left.
  mongo:
    image: mongo:${GW_MONGO_TAG}
    container_name: gw-test-mongo
    profiles: [mongo, all]
    command: ["--setParameter", "enableTestCommands=1", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${GW_MONGO_ROOT_PASSWORD}
    tmpfs:
      - /data/db
      - /data/configdb
    ports:
      - "127.0.0.1:${GW_MONGO_PORT}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      <<: *health

  mongo-open:
    image: mongo:${GW_MONGO_TAG}
    container_name: gw-test-mongo-open
    profiles: [mongo, all]
    command: ["--setParameter", "enableTestCommands=1", "--wiredTigerCacheSizeGB", "0.25"]
    tmpfs:
      - /data/db
      - /data/configdb
    ports:
      - "127.0.0.1:${GW_MONGO_OPEN_PORT}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      <<: *health

  mongo-tls:
    image: mongo:${GW_MONGO_TAG}
    container_name: gw-test-mongo-tls
    profiles: [mongo, all]
    depends_on: *certs
    command: ["--setParameter", "enableTestCommands=1", "--wiredTigerCacheSizeGB", "0.25",
              "--tlsMode", "requireTLS", "--tlsCertificateKeyFile", "/certs/localhost-ip.pem",
              "--tlsCAFile", "/certs/ca.crt", "--tlsAllowConnectionsWithoutCertificates"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${GW_MONGO_ROOT_PASSWORD}
    volumes:
      - ./run/certs:/certs:ro
    tmpfs:
      - /data/db
      - /data/configdb
    ports:
      - "127.0.0.1:${GW_MONGO_TLS_PORT}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--tls", "--tlsCAFile", "/certs/ca.crt", "--host", "localhost",
             "--eval", "db.adminCommand('ping').ok"]
      <<: *health

  mongo7:
    image: mongo:${GW_MONGO7_TAG}
    container_name: gw-test-mongo7
    profiles: [mongo, all]
    command: ["--setParameter", "enableTestCommands=1", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${GW_MONGO_ROOT_PASSWORD}
    tmpfs:
      - /data/db
      - /data/configdb
    ports:
      - "127.0.0.1:${GW_MONGO7_PORT}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      <<: *health

  mongo9:
    image: mongo:${GW_MONGO9_TAG}
    container_name: gw-test-mongo9
    profiles: [mongo, all]
    command: ["--setParameter", "enableTestCommands=1", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${GW_MONGO_ROOT_PASSWORD}
    tmpfs:
      - /data/db
      - /data/configdb
    ports:
      - "127.0.0.1:${GW_MONGO9_PORT}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      <<: *health

  # ── Neo4j ───────────────────────────────────────────────────────────────────────────────────────────────────
  # Neo4j 5 Community for connectors/neo4j (docs/neo4j.md), no plugins. Bolt takes TLS and plain connections on one
  # port: its certificate (DNS:localhost, IP:127.0.0.1) and gw-test-ca come from gen-certs.sh, run by a one-shot of
  # this profile into run/neo4j-certs, apart from the certs of the other profiles. The IT signs in as neo4j and
  # resets the database.
  neo4j-certs:
    image: alpine:${GW_ALPINE_TAG}
    container_name: gw-test-neo4j-certs
    profiles: [neo4j, all]
    command: ["/bin/sh", "-c", "/bin/sh /scripts/gen-certs.sh /out && mkdir -p /out/trusted /out/revoked"]
    volumes:
      - ./scripts:/scripts:ro
      - ./run/neo4j-certs:/out

  neo4j:
    image: neo4j:${GW_NEO4J_TAG}
    container_name: gw-test-neo4j
    profiles: [neo4j, all]
    depends_on:
      neo4j-certs:
        condition: service_completed_successfully
    mem_limit: 1g
    environment:
      NEO4J_AUTH: neo4j/${GW_NEO4J_PASSWORD}
      NEO4J_dbms_usage__report_enabled: "false"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
      # neo4j:// follows the routing table, which must name the published port.
      NEO4J_server_bolt_advertised__address: 127.0.0.1:${GW_NEO4J_PORT}
      NEO4J_server_bolt_tls__level: OPTIONAL
      NEO4J_dbms_ssl_policy_bolt_enabled: "true"
      NEO4J_dbms_ssl_policy_bolt_base__directory: /certs
      NEO4J_dbms_ssl_policy_bolt_private__key: localhost-ip.key
      NEO4J_dbms_ssl_policy_bolt_public__certificate: localhost-ip.crt
      NEO4J_dbms_ssl_policy_bolt_client__auth: NONE
      NEO4J_dbms_ssl_policy_bolt_trusted__dir: /certs/trusted
      NEO4J_dbms_ssl_policy_bolt_revoked__dir: /certs/revoked
    volumes:
      - ./run/neo4j-certs:/certs:ro
    ports:
      - "127.0.0.1:${GW_NEO4J_PORT}:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7474 || exit 1"]
      <<: *health

  # ── Redis ───────────────────────────────────────────────────────────────────────────────────────────────────
  # Users of redis/users*.acl, passwords "<user>-pass"; the tests reload them with ACL LOAD before they start.
  # The machine's own platform: the glob of SCAN MATCH compares bytes as C chars (signed on x86-64, unsigned on arm64
  # Linux), Test connection finds out which (globChars), and RedisGlobPropertyIT and Redis62IT follow the server.
  redis:
    image: redis:${GW_REDIS_TAG}
    container_name: gw-test-redis
    profiles: [redis, all]
    depends_on: *certs
    command: ["redis-server", "--port", "6379", "--save", "", "--appendonly", "no", "--protected-mode", "no",
              "--aclfile", "/conf/users.acl",
              "--tls-port", "6380", "--tls-cert-file", "/certs/localhost.crt", "--tls-key-file", "/certs/localhost.key",
              "--tls-ca-cert-file", "/certs/ca.crt", "--tls-auth-clients", "no"]
    volumes:
      - ./redis:/conf:ro
      - ./run/certs:/certs:ro
    ports:
      - "127.0.0.1:${GW_REDIS_PORT}:6379"
      - "127.0.0.1:${GW_REDIS_TLS_PORT}:6380"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "default-pass", "ping"]
      <<: *health

  redis-replica:
    image: redis:${GW_REDIS_TAG}
    container_name: gw-test-redis-replica
    profiles: [redis, all]
    depends_on:
      redis:
        condition: service_healthy
    command: ["redis-server", "--port", "6379", "--save", "", "--appendonly", "no", "--protected-mode", "no",
              "--aclfile", "/conf/users.acl", "--replicaof", "redis", "6379", "--masteruser", "default",
              "--masterauth", "default-pass", "--replica-read-only", "yes"]
    volumes:
      - ./redis:/conf:ro
    ports:
      - "127.0.0.1:${GW_REDIS_REPLICA_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "default-pass", "ping"]
      <<: *health

  redis-open:
    image: redis:${GW_REDIS_TAG}
    container_name: gw-test-redis-open
    profiles: [redis, all]
    command: ["redis-server", "--port", "6379", "--save", "", "--appendonly", "no", "--protected-mode", "no",
              "--aclfile", "/conf/users-open.acl"]
    volumes:
      - ./redis:/conf:ro
    ports:
      - "127.0.0.1:${GW_REDIS_OPEN_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *health

  redis-cluster:
    image: redis:${GW_REDIS_TAG}
    container_name: gw-test-redis-cluster
    profiles: [redis, all]
    command: ["redis-server", "--port", "6379", "--save", "", "--appendonly", "no", "--protected-mode", "no",
              "--aclfile", "/conf/users.acl", "--cluster-enabled", "yes", "--cluster-config-file", "/data/nodes.conf"]
    volumes:
      - ./redis:/conf:ro
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:${GW_REDIS_CLUSTER_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "default-pass", "ping"]
      <<: *health

  redis62:
    image: redis:${GW_REDIS62_TAG}
    container_name: gw-test-redis62
    profiles: [redis, all]
    depends_on: *certs
    command: ["redis-server", "--port", "6379", "--save", "", "--appendonly", "no", "--protected-mode", "no",
              "--aclfile", "/conf/users62.acl",
              "--tls-port", "6380", "--tls-cert-file", "/certs/localhost.crt", "--tls-key-file", "/certs/localhost.key",
              "--tls-ca-cert-file", "/certs/ca.crt", "--tls-auth-clients", "no"]
    volumes:
      - ./redis:/conf:ro
      - ./run/certs:/certs:ro
    ports:
      - "127.0.0.1:${GW_REDIS62_PORT}:6379"
      - "127.0.0.1:${GW_REDIS62_TLS_PORT}:6380"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "default-pass", "ping"]
      <<: *health

  # ── Logs and AWS ────────────────────────────────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:${GW_LOKI_TAG}
    container_name: gw-test-loki
    profiles: [logs, all]
    command: ["-config.file=/etc/loki/gw-loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/gw-loki.yaml:ro
    tmpfs:
      - /loki:mode=1777
    ports:
      - "127.0.0.1:${GW_LOKI_PORT}:3100"

  opensearch:
    image: opensearchproject/opensearch:${GW_OPENSEARCH_TAG}
    container_name: gw-test-opensearch
    profiles: [logs, all]
    environment:
      discovery.type: single-node
      cluster.name: gw-logs-it
      cluster.routing.allocation.disk.threshold_enabled: "false"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    tmpfs:
      - /usr/share/opensearch/data:uid=1000,gid=1000
    ports:
      - "127.0.0.1:${GW_OPENSEARCH_PORT}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s'"]
      <<: *health

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${GW_ELASTICSEARCH_TAG}
    container_name: gw-test-elasticsearch
    profiles: [logs, all]
    environment:
      discovery.type: single-node
      cluster.name: gw-elasticsearch-it
      cluster.routing.allocation.disk.threshold_enabled: "false"
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    tmpfs:
      - /usr/share/elasticsearch/data:uid=1000,gid=0
    ports:
      - "127.0.0.1:${GW_ELASTICSEARCH_PORT}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s'"]
      <<: *health

  moto:
    image: motoserver/moto:${GW_MOTO_TAG}
    container_name: gw-test-moto
    profiles: [logs, aws, dynamodb, s3, all]
    ports:
      - "127.0.0.1:${GW_MOTO_PORT}:5000"

  # ── Metrics ─────────────────────────────────────────────────────────────────────────────────────────────────
  # Prometheus scraping itself (prometheus/prometheus.yml), with a down target, a dropped one and rules that record
  # and alert. Its TSDB is in memory; no admin, lifecycle or remote write endpoint is enabled.
  prometheus:
    image: prom/prometheus:${GW_PROMETHEUS_TAG}
    container_name: gw-test-prometheus
    profiles: [prometheus, all]
    mem_limit: 256m
    command: ["--config.file=/etc/prometheus/gw-prometheus.yml", "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=1d", "--query.timeout=30s"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/gw-prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/gw-rules.yml:ro
    tmpfs:
      - /prometheus:mode=1777
    ports:
      - "127.0.0.1:${GW_PROMETHEUS_PORT}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      <<: *health

  # ── InfluxDB ────────────────────────────────────────────────────────────────────────────────────────────────
  # InfluxDB 3 Core in memory. Its admin token is the one of .env, written to a token file at start-up and loaded
  # with --admin-token-file: no setup call and no network. /health stays open for the health check, /ping and the
  # APIs need the token; no telemetry upload, no package management. The connector's IT makes its own databases.
  influxdb3:
    image: influxdb:${GW_INFLUXDB3_TAG}
    container_name: gw-test-influxdb3
    profiles: [influxdb, all]
    mem_limit: 512m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"token": "%s", "name": "_admin"}' "$$GW_INFLUXDB3_TOKEN" > /tmp/admin-token.json &&
        chmod 600 /tmp/admin-token.json &&
        exec influxdb3 serve --node-id gw-test --object-store memory --admin-token-file /tmp/admin-token.json
        --disable-authz health --disable-telemetry-upload --disable-package-management
        --exec-mem-pool-size 128MB --file-cache-size 32MB
    environment:
      GW_INFLUXDB3_TOKEN: ${GW_INFLUXDB3_TOKEN}
    ports:
      - "127.0.0.1:${GW_INFLUXDB3_PORT}:8181"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8181/health"]
      <<: *health

  # InfluxDB 2.9, set up on every start (DOCKER_INFLUXDB_INIT_*, data and CLI configuration in tmpfs): organization
  # acme, bucket metrics, the operator token of .env. The IT adds its own bucket and a token that may only read it.
  influxdb2:
    image: influxdb:${GW_INFLUXDB2_TAG}
    container_name: gw-test-influxdb2
    profiles: [influxdb, all]
    mem_limit: 512m
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: gaterook
      DOCKER_INFLUXDB_INIT_PASSWORD: ${GW_INFLUXDB2_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: acme
      DOCKER_INFLUXDB_INIT_BUCKET: metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${GW_INFLUXDB2_TOKEN}
      INFLUXD_REPORTING_DISABLED: "true"
    tmpfs:
      - /var/lib/influxdb2
      - /etc/influxdb2
    ports:
      - "127.0.0.1:${GW_INFLUXDB2_PORT}:8086"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8086/health"]
      <<: *health

  # ── Vector databases and search engines (connectors/search) ───────────────────────────────────────────────
  # In tmpfs (Milvus in its disposable container filesystem), each with the API keys of .env; the IT makes its own
  # collections and indexes. Pinecone's
  # local image (end of life 2026-10-07, the last image pinned by digest) runs the control plane and its indexes on the
  # published range. Images without a shell tool have no health check: the IT waits until each answers.
  qdrant:
    image: qdrant/qdrant:${GW_QDRANT_TAG}
    container_name: gw-test-qdrant
    profiles: [search, all]
    mem_limit: 512m
    environment:
      QDRANT__SERVICE__API_KEY: ${GW_QDRANT_API_KEY}
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${GW_QDRANT_READ_KEY}
      QDRANT__TELEMETRY_DISABLED: "true"
    tmpfs:
      - /qdrant/storage
    ports:
      - "127.0.0.1:${GW_QDRANT_PORT}:6333"

  milvus:
    image: milvusdb/milvus:${GW_MILVUS_TAG}
    container_name: gw-test-milvus
    profiles: [search, all]
    mem_limit: 2g
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    volumes:
      - ./milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ./milvus/user.yaml:/milvus/configs/user.yaml:ro
    ports:
      - "127.0.0.1:${GW_MILVUS_PORT}:19530"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:9091/healthz"]
      <<: *health

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:${GW_WEAVIATE_TAG}
    container_name: gw-test-weaviate
    profiles: [search, all]
    mem_limit: 512m
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${GW_WEAVIATE_API_KEY},${GW_WEAVIATE_READ_KEY}
      AUTHENTICATION_APIKEY_USERS: admin,reader
      AUTHORIZATION_ADMINLIST_ENABLED: "true"
      AUTHORIZATION_ADMINLIST_USERS: admin
      AUTHORIZATION_ADMINLIST_READONLY_USERS: reader
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      DISABLE_TELEMETRY: "true"
    tmpfs:
      - /var/lib/weaviate
    ports:
      - "127.0.0.1:${GW_WEAVIATE_PORT}:8080"

  chroma:
    image: chromadb/chroma:${GW_CHROMA_TAG}
    container_name: gw-test-chroma
    profiles: [search, all]
    mem_limit: 512m
    environment:
      ANONYMIZED_TELEMETRY: "false"
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:${GW_CHROMA_PORT}:8000"

  pinecone:
    image: ghcr.io/pinecone-io/pinecone-local:${GW_PINECONE_TAG}
    container_name: gw-test-pinecone
    profiles: [search, all]
    mem_limit: 512m
    environment:
      PORT: ${GW_PINECONE_PORT}
      PINECONE_HOST: localhost
    ports:
      - "127.0.0.1:${GW_PINECONE_PORT}-${GW_PINECONE_LAST_PORT}:${GW_PINECONE_PORT}-${GW_PINECONE_LAST_PORT}"

  meilisearch:
    image: getmeili/meilisearch:${GW_MEILISEARCH_TAG}
    container_name: gw-test-meilisearch
    profiles: [search, all]
    mem_limit: 512m
    environment:
      MEILI_MASTER_KEY: ${GW_MEILISEARCH_MASTER_KEY}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      MEILI_DB_PATH: /meili_data/data.ms
    tmpfs:
      - /meili_data
    ports:
      - "127.0.0.1:${GW_MEILISEARCH_PORT}:7700"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:7700/health"]
      <<: *health

  typesense:
    image: typesense/typesense:${GW_TYPESENSE_TAG}
    container_name: gw-test-typesense
    profiles: [search, all]
    mem_limit: 512m
    command: ["--data-dir", "/data", "--api-key", "${GW_TYPESENSE_API_KEY}", "--enable-cors=false"]
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:${GW_TYPESENSE_PORT}:8108"

  # ── Secrets and SSH ─────────────────────────────────────────────────────────────────────────────────────────
  # Dev mode: in memory, unsealed, the root token of .env. Vault reaches PostgreSQL as postgres:5432.
  vault:
    image: hashicorp/vault:${GW_VAULT_TAG}
    container_name: gw-test-vault
    profiles: [vault, ssh, all]
    command: ["server", "-dev", "-dev-root-token-id=${GW_VAULT_ROOT_TOKEN}", "-dev-listen-address=0.0.0.0:8200"]
    cap_add: [IPC_LOCK]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:${GW_VAULT_PORT}:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      <<: *health

  openssh:
    build:
      context: ./openssh
      args:
        UBUNTU_TAG: ${GW_UBUNTU_TAG}
    image: gw-test/openssh:${GW_UBUNTU_TAG}
    container_name: gw-test-openssh
    profiles: [ssh, all]
    volumes:
      - ./run/openssh:/keys
    ports:
      - "127.0.0.1:${GW_OPENSSH_PORT}:22"
    healthcheck:
      test: ["CMD", "pgrep", "-x", "sshd"]
      <<: *health

  # ── Kubernetes ──────────────────────────────────────────────────────────────────────────────────────────────
  # A one-node k3s with a kubelet (k8s_logs of real pods); its kubeconfig is run/k3s/kubeconfig.yaml.
  k3s:
    image: rancher/k3s:${GW_K3S_TAG}
    container_name: gw-test-k3s
    profiles: [k8s, all]
    privileged: true
    command: ["server", "--disable=traefik,metrics-server,servicelb", "--https-listen-port=${GW_K3S_PORT}",
              "--tls-san=127.0.0.1", "--write-kubeconfig=/out/kubeconfig.yaml", "--write-kubeconfig-mode=644"]
    environment:
      KUBECONFIG: /out/kubeconfig.yaml
    tmpfs:
      - /run
      - /var/run
    volumes:
      - ./run/k3s:/out
    ports:
      - "127.0.0.1:${GW_K3S_PORT}:${GW_K3S_PORT}"
    healthcheck:
      test: ["CMD", "kubectl", "get", "--raw", "/readyz"]
      <<: *health
