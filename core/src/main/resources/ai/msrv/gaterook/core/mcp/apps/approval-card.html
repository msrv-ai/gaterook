<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="{{CSP}}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GateRook approval</title>
  <style>{{KIT_CSS}}</style>
</head>
<body>
  <main class="gw-card" aria-labelledby="card-title" id="approval-card">
    <header class="gw-card__header">
      <div class="gw-card__heading">
        <h1 class="gw-card__title" id="card-title">GateRook approval</h1>
        <p class="gw-card__description" id="status-description" role="status">Connecting to this chat…</p>
      </div>
      <span class="gw-badge gw-badge--neutral" id="status-badge">Connecting</span>
    </header>
    <div class="gw-card__body gw-stack">
      <div class="gw-alert gw-alert--danger" id="card-error" role="alert" hidden>
        <div class="gw-alert__content"><p class="gw-alert__body" id="error-message"></p></div>
      </div>
      <div class="gw-stack" id="request-content" hidden>
        <dl class="gw-kv gw-kv--dense">
          <div class="gw-kv__row"><dt class="gw-kv__key">Tool</dt><dd class="gw-kv__value"><code class="gw-code" id="request-tool"></code></dd></div>
          <div class="gw-kv__row"><dt class="gw-kv__key">Connection</dt><dd class="gw-kv__value"><code class="gw-code" id="request-connection"></code> <span class="gw-env" id="request-environment"></span></dd></div>
          <div class="gw-kv__row"><dt class="gw-kv__key">Request</dt><dd class="gw-kv__value"><code class="gw-code" id="request-handle"></code></dd></div>
          <div class="gw-kv__row" id="expiry-row"><dt class="gw-kv__key">Time remaining</dt><dd class="gw-kv__value gw-tabular" id="request-expiry" role="timer" aria-live="off"></dd></div>
        </dl>
        <section class="gw-stack gw-stack--sm" aria-labelledby="request-label">
          <h2 class="gw-text-small" id="request-label">
            <button class="gw-btn gw-btn--ghost gw-btn--sm" id="arguments-toggle" type="button" aria-expanded="false" aria-controls="request-arguments">
              <svg class="gw-icon gw-icon--sm gw-btn__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
              Requested arguments
            </button>
          </h2>
          <div class="gw-stack gw-stack--sm" id="request-arguments" hidden>
            <div class="gw-code-block gw-code-block--wrap gw-code-block--scroll">
              <div class="gw-code-block__header"><span class="gw-code-block__lang" id="request-language"></span></div>
              <div class="gw-code-block__body" tabindex="0" role="region" aria-label="Requested arguments"><pre class="gw-code-block__pre"><code id="request-text"></code></pre></div>
            </div>
            <p class="gw-text-small" id="request-truncated" hidden>Preview shortened. Open GateRook to review the complete action.</p>
          </div>
        </section>
      </div>
    </div>
    <footer class="gw-card__footer gw-card__actions">
      <button class="gw-btn gw-btn--ghost" id="refresh-button" type="button" disabled>Refresh</button>
      <button class="gw-btn gw-btn--secondary" id="details-button" type="button" disabled>Details</button>
      <button class="gw-btn gw-btn--danger" id="deny-button" type="button" disabled>Deny</button>
      <button class="gw-btn gw-btn--primary" id="approve-button" type="button" disabled>Approve in GateRook</button>
    </footer>
  </main>
  <script type="module">{{APP_JS}}</script>
</body>
</html>
