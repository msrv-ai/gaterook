# Tests: no core.log. Logging starts before the test's dynamic properties (gateway.home) exist, so the main
# configuration's ${gateway.home}/logs/core.log would resolve to the real ~/.gaterook.
logging:
  file:
    name: ""

# Tests: no published list. A core reads GateRook's list of connector modules from GitHub by itself; a test's core
# has no channel unless the test gives it one (gateway.modules.channel-url and gateway.modules.channel-keys).
gateway:
  lists: none
